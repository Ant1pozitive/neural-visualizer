# frontend/nginx.conf - simple SPA config: serve index.html for unknown routes
server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: set cache headers for static assets
    location ~* \.(?:css|js|json|svg|ico|jpg|jpeg|png|gif|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
